name: Mirror builds

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - id: mirror
        run: python3 .github/scripts/mirror.py
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.mirror.outputs.state_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mirrored.json
          git commit -m "mirror: update state"
          git push
