name: Mirror builds

# GitHub runs the `*/5` schedule of a quiet public repo only every 2-10 hours
# (observed Oct-Nov 2026), while the AI-Game-Dev-App release waits at most
# ~45 min for this mirror. So one run polls in a loop for about five and a half
# hours and then starts the next run itself: a run dispatched with GITHUB_TOKEN
# via workflow_dispatch does start (the documented exception), so no extra
# token is needed. The schedule stays as a safety net that restarts the chain if
# a run dies; while a run is looping, a scheduled or manual run waits in the
# concurrency queue. To mirror right now, cancel the running run and dispatch:
#   gh run cancel <id> -R IvanMurzak/AI-Game-Dev-Releases
#   gh workflow run mirror.yml -R IvanMurzak/AI-Game-Dev-Releases
# A cancelled run does not start the next one, so cancelling (without a
# dispatch) stops the chain until the next scheduled run.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      loop_minutes:
        description: "How long this run keeps polling (a test: 3)"
        required: false
        default: "320"

permissions:
  contents: write
  actions: write # only to dispatch the next run of this workflow

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    # The loop stops starting passes after LOOP_MINUTES; one pass that uploads a
    # full release can take ~20 min, and the job must end before this timeout or
    # it is cancelled and the next run is not dispatched.
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      LOOP_MINUTES: ${{ inputs.loop_minutes || '320' }}
      INTERVAL_SECONDS: "120"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the loop rebases its state commits onto origin

      - name: Mirror in a loop
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          deadline=$(( SECONDS + LOOP_MINUTES * 60 ))
          failures=0
          pass=0
          while :; do
            pass=$(( pass + 1 ))
            echo "::group::pass ${pass} ($(date -u +%H:%M:%SZ))"
            if ! python3 .github/scripts/mirror.py; then
              failures=$(( failures + 1 ))
              echo "::error::mirror pass ${pass} failed; retrying in ${INTERVAL_SECONDS}s"
            elif ! git diff --quiet -- mirrored.json; then
              git add mirrored.json
              git commit -q -m "mirror: update state"
              if ! { git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}"; }; then
                failures=$(( failures + 1 ))
                echo "::error::pushing mirrored.json failed in pass ${pass}"
                git rebase --abort 2>/dev/null || true
              fi
            fi
            echo "::endgroup::"
            if (( SECONDS + INTERVAL_SECONDS >= deadline )); then break; fi
            sleep "${INTERVAL_SECONDS}"
          done
          echo "${pass} pass(es), ${failures} failed"
          # A failed pass still lets the loop retry, but the run ends red.
          (( failures == 0 ))

      # Only on main: a test run on another branch must not start a chain there.
      - name: Start the next run
        if: ${{ !cancelled() && github.ref_name == 'main' }}
        run: gh workflow run mirror.yml --repo "${GITHUB_REPOSITORY}" --ref "${GITHUB_REF_NAME}"
